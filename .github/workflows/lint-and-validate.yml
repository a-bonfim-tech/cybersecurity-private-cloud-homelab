name: Repository Lint & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Validate JSON Files
        run: python3 -m json.tool attack-graphs/server-ingress-attack-graph.json > /dev/null
